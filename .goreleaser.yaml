# GoReleaser configuration for the nebu CLI.
# Published processors are released independently from nebu-processor-registry.

version: 2

before:
  hooks:
    - go mod download

builds:
  - id: nebu
    main: ./cmd/nebu
    binary: nebu
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/withObsrvr/nebu/pkg/version.Version={{.Version}}

archives:
  - id: nebu-cli
    formats:
      - tar.gz
    name_template: "nebu_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - nebu
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

dockers_v2:
  - id: nebu
    ids:
      - nebu
    dockerfile: Dockerfile.goreleaser
    images:
      - withobsrvr/nebu
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

release:
  github:
    owner: withObsrvr
    name: nebu
  draft: false
  prerelease: auto
