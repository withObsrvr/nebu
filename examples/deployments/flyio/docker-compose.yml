# Docker Compose for Local Testing
# This allows you to test the nebu indexer locally before deploying to Fly.io

version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: nebu-postgres
    environment:
      POSTGRES_DB: nebu_indexer
      POSTGRES_USER: nebu
      POSTGRES_PASSWORD: nebu_local_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nebu-network

  # nebu indexer
  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebu-indexer
    environment:
      # Database connection
      DATABASE_URL: postgresql://nebu:nebu_local_password@postgres:5432/nebu_indexer

      # Stellar RPC endpoint
      RPC_URL: https://mainnet.sorobanrpc.com

      # Configuration
      START_LEDGER: latest
      BATCH_SIZE: 1000
      LOG_LEVEL: info

      # For testing with testnet:
      # RPC_URL: https://soroban-testnet.stellar.org
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount data directory for checkpoints
      - indexer_data:/data

      # Optional: Mount scripts for live editing during development
      # - ./scripts:/scripts:ro
    networks:
      - nebu-network
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nebu-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nebu.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - nebu-network
    profiles:
      - debug  # Only start with: docker-compose --profile debug up

volumes:
  postgres_data:
    driver: local
  indexer_data:
    driver: local

networks:
  nebu-network:
    driver: bridge
