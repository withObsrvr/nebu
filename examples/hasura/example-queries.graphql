    event_data
  }
}

# ============================================================================
# CONTRACT INVOCATIONS
# ============================================================================

# Get recent contract calls
query GetRecentInvocations {
  contract_invocations_summary(
    order_by: {timestamp: desc}
    limit: 20
  ) {
    toid
    function_name
    contract_id
    successful
    ledger
    tx_hash
    timestamp
    arg_count
    state_change_count
    diagnostic_event_count
  }
}

# Get calls for specific contract
query GetContractCalls($contractId: String!) {
  contract_invocations_summary(
    where: {contract_id: {_eq: $contractId}}
    order_by: {timestamp: desc}
  ) {
    function_name
    successful
    tx_hash
    timestamp
    arg_count
    state_change_count
  }
}

# Variables:
# {
#   "contractId": "CAVS7HEUNFCMOW6DC7EBY7J6HNFJ5JJ7LV4H7RPUC6V5QO5OMS7AQLD5"
# }

# Get failed invocations
query GetFailedInvocations {
  failed_invocations(
    order_by: {timestamp: desc}
    limit: 20
  ) {
    function_name
    contract_id
    tx_hash
    timestamp
    arg_count
  }
}

# Get successful invocations by function
query GetFunctionCalls($functionName: String!) {
  successful_invocations(
    where: {function_name: {_eq: $functionName}}
    order_by: {timestamp: desc}
    limit: 50
  ) {
    contract_id
    tx_hash
    timestamp
    arg_count
    state_change_count
  }
}

# Variables:
# {
#   "functionName": "sink_carbon"
# }

# ============================================================================
# ANALYTICS & AGGREGATIONS
# ============================================================================

# Get hourly activity
query GetHourlyActivity {
  hourly_activity(
    order_by: {hour: desc}
    limit: 24
  ) {
    hour
    event_count
    unique_senders
    unique_receivers
    total_volume
  }
}

# Get daily USDC volume
query GetDailyUSDCVolume {
  daily_usdc_volume(
    order_by: {day: desc}
    limit: 30
  ) {
    day
    transfer_count
    total_volume
    avg_amount
    unique_senders
    unique_receivers
  }
}

# Get contract activity leaderboard
query GetContractLeaderboard {
  contract_activity(
    order_by: {total_events: desc}
    limit: 20
  ) {
    contract_address
    total_events
    unique_assets
    total_volume
    first_seen
    last_seen
  }
}

# Get recent activity feed
query GetRecentActivity {
  recent_activity(
    limit: 50
  ) {
    toid
    activity_type
    actor
    target
    amount
    asset_code
    tx_hash
    timestamp
  }
}

# Get daily stats (materialized view)
query GetDailyStats {
  daily_stats(
    order_by: {day: desc}
    limit: 30
  ) {
    day
    total_transfers
    total_volume
    unique_senders
    unique_receivers
    unique_assets
  }
}

# ============================================================================
# AGGREGATIONS
# ============================================================================

# Count total USDC transfers
query CountUSDCTransfers {
  usdc_transfers_aggregate {
    aggregate {
      count
      sum {
        amount
      }
      avg {
        amount
      }
      max {
        amount
      }
    }
  }
}

# Group transfers by asset
query GroupByAsset {
  token_transfers_aggregate(
    where: {successful: {_eq: true}}
  ) {
    nodes {
      asset_code
    }
    aggregate {
      count
      sum {
        amount
      }
    }
  }
}

# Count offsets by project
query CountByProject {
  carbon_offsets_aggregate {
    nodes {
      project_id
    }
    aggregate {
      count
      sum {
        amount
      }
    }
  }
}

# ============================================================================
# COMBINED QUERIES
# ============================================================================

# Dashboard query (get everything)
query GetDashboard {
  # Recent transfers
  recent_transfers: token_transfers(
    order_by: {timestamp: desc}
    limit: 10
  ) {
    from_address
    to_address
    amount
    asset_code
    timestamp
  }

  # Recent carbon offsets
  recent_offsets: carbon_offsets(
    order_by: {timestamp: desc}
    limit: 10
  ) {
    funder
    amount
    project_id
    timestamp
  }

  # Stats
  transfer_stats: token_transfers_aggregate {
    aggregate {
      count
      sum {
        amount
      }
    }
  }

  carbon_stats: carbon_offsets_aggregate {
    aggregate {
      count
      sum {
        amount
      }
    }
  }

  # Top movers
  top_assets: top_movers(limit: 5) {
    asset_code
    total_volume
    transfer_count
  }
}

