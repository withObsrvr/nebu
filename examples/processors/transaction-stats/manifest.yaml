name: stellar/transaction-stats
version: 0.1.0
type: origin

display_name: Stellar Transaction Statistics Processor
description: |
  Example origin processor that aggregates successful and failed transaction
  counts plus successful and failed operation counts across a processed ledger range.

proto:
  input: xdr.LedgerCloseMeta
  output: transaction_stats.TransactionStats

requires:
  stellar_protocol: ">=23"
  network: "public, testnet"

events:
  - summary: One summary event emitted at end of range

usage:
  go: |
    import (
        "context"
        "github.com/stellar/go-stellar-sdk/network"
        transaction_stats "github.com/withObsrvr/nebu/examples/processors/transaction-stats"
        "github.com/withObsrvr/nebu/pkg/runtime"
        "github.com/withObsrvr/nebu/pkg/source/rpc"
    )

    src, _ := rpc.NewLedgerSource("https://archive-rpc.lightsail.network")
    origin := transaction_stats.NewOrigin(network.PublicNetworkPassphrase)
    rt := runtime.NewRuntime()
    rt.RunOrigin(context.Background(), src, origin, 60200000, 60200009)

maintainer:
  name: OBSRVR
  url: https://withobsrvr.com
  contact: support@withobsrvr.com

repository: https://github.com/withObsrvr/nebu

license: MIT
