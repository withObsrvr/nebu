# nebu Processor Registry
#
# This file defines available processors that can be run via `nebu run`.
# Processors can be local (in examples/) or external (git repos, go modules).

version: 1

processors:
  # Token Transfer Origin Processor
  - name: token-transfer
    type: origin
    description: Stream token transfer events from Stellar ledgers (transfers, mints, burns, clawbacks, fees)
    long_description: |
      Extracts Stellar Asset Contract (SAC) token events from ledger data.
      Produces events for transfers, mints, burns, clawbacks, and network fees.
      Supports both native XLM and wrapped assets (USDC, etc).

    # Local example processor
    location:
      type: local
      path: ./examples/processors/token-transfer
      package: github.com/withObsrvr/nebu/examples/processors/token-transfer
      module_package: github.com/withObsrvr/nebu/examples/processors/token-transfer/cmd/token-transfer

    # Service binary (for standalone mode)
    service:
      binary: ./cmd/nebu-ttpd
      default_port: 8080
      env:
        - NEBU_RPC_URL
        - NEBU_LISTEN_ADDR
        - NEBU_NETWORK

    # Protocol buffer definitions
    proto:
      # Uses Stellar's official token_transfer.proto
      source: github.com/stellar/go-stellar-sdk/protos/processors/token_transfer
      package: token_transfer

    # JSON Schema (for CLI output)
    schema:
      version: v1
      identifier: nebu.token_transfer.v1
      documentation: ./examples/processors/token-transfer/SCHEMA.md

    # Event types produced
    events:
      - name: transfer
        description: Token sent between accounts
      - name: mint
        description: New tokens created
      - name: burn
        description: Tokens destroyed
      - name: clawback
        description: Tokens clawed back by issuer
      - name: fee
        description: Network fee payment

    # Output field descriptions
    output_fields:
      - path: _schema
        description: Schema identifier (nebu.token_transfer.v1)
      - path: meta.ledgerSequence
        description: Ledger number
      - path: meta.txHash
        description: Transaction hash
      - path: meta.closedAt
        description: Ledger close time (ISO 8601)
      - path: transfer.from
        description: Source account (G...)
      - path: transfer.to
        description: Destination account (G...)
      - path: transfer.amount
        description: Amount in stroops (string)
      - path: transfer.assetCode
        description: Asset code (e.g., "USDC", "XLM")

    # Usage examples
    examples:
      - comment: Basic usage
        command: token-transfer --start-ledger 60200000 --end-ledger 60200100
      - comment: Filter for specific asset
        command: token-transfer ... | jq 'select(.transfer.assetCode == "USDC")'
      - comment: Chain with transform processors
        command: token-transfer ... | usdc-filter | amount-filter --min 1000000
      - comment: Store results
        command: token-transfer ... | json-file-sink --out transfers.jsonl

    # Compatibility info
    works_with:
      input:
        - nebu fetch
      transforms:
        - usdc-filter
        - amount-filter
        - dedup
        - time-window
      sinks:
        - json-file-sink
        - nats-sink
        - postgres-sink

    # Metadata
    manifest: ./examples/processors/token-transfer/manifest.yaml
    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # Contract Events Origin Processor
  - name: contract-events
    type: origin
    description: Extract all contract events from Stellar ledgers (not limited to token transfers)

    # Local example processor
    location:
      type: local
      path: ./examples/processors/contract-events
      package: github.com/withObsrvr/nebu/examples/processors/contract-events
      module_package: github.com/withObsrvr/nebu/examples/processors/contract-events/cmd/contract-events

    # JSON Schema (for CLI output)
    schema:
      version: v1
      identifier: nebu.contract-events.v1
      documentation: ./examples/processors/contract-events/README.md

    # Metadata
    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # JSON File Sink
  - name: json-file-sink
    type: sink
    description: Write events to newline-delimited JSON (JSONL) files

    location:
      type: local
      path: ./examples/processors/json-file-sink
      package: github.com/withObsrvr/nebu/examples/processors/json-file-sink
      module_package: github.com/withObsrvr/nebu/examples/processors/json-file-sink/cmd/json-file-sink

    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # NATS Sink
  - name: nats-sink
    type: sink
    description: Publish events to NATS message bus for real-time distribution

    location:
      type: local
      path: ./examples/processors/nats-sink
      package: github.com/withObsrvr/nebu/examples/processors/nats-sink
      module_package: github.com/withObsrvr/nebu/examples/processors/nats-sink/cmd/nats-sink

    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # PostgreSQL Sink
  - name: postgres-sink
    type: sink
    description: Store events in PostgreSQL with JSONB schema and TOID-based idempotency

    location:
      type: local
      path: ./examples/processors/postgres-sink
      package: github.com/withObsrvr/nebu/examples/processors/postgres-sink
      module_package: github.com/withObsrvr/nebu/examples/processors/postgres-sink/cmd/postgres-sink

    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # Amount Filter Transform
  - name: amount-filter
    type: transform
    description: Filter token transfer events by amount ranges and asset codes

    location:
      type: local
      path: ./examples/processors/amount-filter
      package: github.com/withObsrvr/nebu/examples/processors/amount-filter
      module_package: github.com/withObsrvr/nebu/examples/processors/amount-filter/cmd/amount-filter

    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # USDC Filter Transform
  - name: usdc-filter
    type: transform
    description: Filter token transfer events for USDC transfers only

    location:
      type: local
      path: ./examples/processors/usdc-filter
      package: github.com/withObsrvr/nebu/examples/processors/usdc-filter
      module_package: github.com/withObsrvr/nebu/examples/processors/usdc-filter/cmd/usdc-filter

    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # Dedup Transform
  - name: dedup
    type: transform
    description: Deduplicate events by key field (e.g., tx_hash)

    location:
      type: local
      path: ./examples/processors/dedup
      package: github.com/withObsrvr/nebu/examples/processors/dedup
      module_package: github.com/withObsrvr/nebu/examples/processors/dedup/cmd/dedup

    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # Time Window Transform
  - name: time-window
    type: transform
    description: Filter events by time window or ledger sequence range

    location:
      type: local
      path: ./examples/processors/time-window
      package: github.com/withObsrvr/nebu/examples/processors/time-window
      module_package: github.com/withObsrvr/nebu/examples/processors/time-window/cmd/time-window

    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # Contract Invocation Origin Processor
  - name: contract-invocation
    type: origin
    description: Stream contract invocation events from Stellar ledgers (function calls, cross-contract calls, state changes)

    location:
      type: local
      path: ./examples/processors/contract-invocation
      package: github.com/withObsrvr/nebu/examples/processors/contract-invocation
      module_package: github.com/withObsrvr/nebu/examples/processors/contract-invocation/cmd/contract-invocation

    schema:
      version: v1
      identifier: nebu.contract-invocation.v1
      documentation: ./examples/processors/contract-invocation/README.md

    maintainer:
      name: OBSRVR
      url: https://withobsrvr.com

  # Future processors can be added here
  # Example of external processor:
  # - name: soroban-events
  #   type: origin
  #   location:
  #     type: git
  #     url: https://github.com/withObsrvr/nebu-processor-soroban
  #   ...
